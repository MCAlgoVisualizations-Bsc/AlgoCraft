# 1. Define a reusable "base template" using an extension field (x-...) and an anchor (&)
x-minecraft-base: &minecraft-base
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    WORLD_PATH: /app/world
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 2G

services:
  minecraft-prod:
    # Inject the base template using the alias (*)
    <<: *minecraft-base
    container_name: minecraft-prod
    ports:
      - "25565:25565"
    volumes:
      - prod-data:/app/world
    profiles:
      - prod

  minecraft-dev:
    <<: *minecraft-base
    container_name: minecraft-dev
    ports:
      - "25566:25565"
    volumes:
      - dev-data:/app/world
    profiles:
      - dev

volumes:
  prod-data:
  dev-data: